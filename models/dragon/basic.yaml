# pytorch_lightning==2.0.0
seed_everything: 1183619458
trainer:
  accelerator: gpu
  strategy: auto
  devices: '1'
  num_nodes: 1
  precision: 32-true
  logger:
    class_path: pytorch_lightning.loggers.TensorBoardLogger
    init_args:
      save_dir: experiments/dragon/
      name: basic
      version: null
      log_graph: false
      default_hp_metric: true
      prefix: ''
      sub_dir: null
      comment: ''
      purge_step: null
      max_queue: 10
      flush_secs: 120
      filename_suffix: ''
  callbacks:
  - class_path: pytorch_lightning.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: null
      monitor: null
      verbose: false
      save_last: true
      save_top_k: -1
      save_weights_only: false
      mode: max
      auto_insert_metric_name: true
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: 10
      save_on_train_epoch_end: null
  - class_path: pytorch_lightning.callbacks.ModelSummary
    init_args:
      max_depth: 3
  fast_dev_run: false
  max_epochs: 400
  min_epochs: 1
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 4
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: false
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
test_only: false
dry_run: false
ckpt_path: null
model:
  class_path: hyve.model.HYVE
  init_args:
    latent_size: 64
    decoder_type: modulated
    grid_resolutions:
    - 4
    - 8
    - 16
    - 32
    - 64
    grid_conv_skip_connection: true
    encoder_interpolation: true
    encoder_use_gnn: true
    encoder_use_cnn: true
    encoder_use_normals: false
    use_multiple_lod: false
    initial_lr: 0.0005
    lr_step_size: 1000
    lr_step_gamma: 0.5
    dataset_type: surface
    samples_ratio: 0.3
    test_custom_grid_res: 256
    test_reconstruction_iso: 0.0
    test_custom_grid_chunk: 1000000
    test_output_grid: false
    loss_function: []
    deepsdf_clamp_value: 0.3
    normal_loss: false
    normal_loss_factor: 0.0001
    enc_activation_function: leakyrelu
    dec_activation_function: leakyrelu
    dec_siren_omega_0: 30.0
    enc_siren_omega_0: 0.3
    scaled_l2_value: 10.0
    positional_encoding:
    - 2.0
    - null
    eikonal_loss:
      use_loss: true
      normalized_normal: 50.0
      surface_point: 3000.0
      surface_normal: 100.0
      non_surface: 100.0
      non_surface_exp: 10.0
      allow_flipped_surface_normal: false
    lr_monitor: val_loss_relative
data:
  class_path: hyve.dataset.IPC
  init_args:
    output_dir: datasets/dragon/
    batch_size: 4
    batch_size_test: 1
    num_workers: 6
    z_sort_positions: false
    z_sort_cell_width: 0.001
    knn_instead_of_mesh: 8
